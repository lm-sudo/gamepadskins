    </pattern>
    <linearGradient id="PanelRim" x1="367" y1="103" x2="636" y2="103" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c356a2"/><stop offset=".47" stop-color="#ae74d1"/><stop offset="1" stop-color="#4f87c2"/>
    </linearGradient>
    <g id="MacroPill">
      <rect x="-28" y="-15" width="56" height="30" rx="13" fill="#b84622" stroke="#79321f" stroke-width="1.7"/>
      <rect x="-25" y="-12.5" width="50" height="24" rx="11" fill="#db652e"/>
      <path d="M-16-8H16 M-21-3H21 M-21 2H21 M-17 7H17" stroke="#a64421" stroke-width="1.4" stroke-linecap="round"/>
