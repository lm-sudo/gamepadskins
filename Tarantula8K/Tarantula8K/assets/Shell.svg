  <title>GameSir Tarantula 8K orange controller shell</title>
  <desc>Flat vector shell traced from the supplied orange Tarantula 8K reference. Live control faces are separate Gamepad Viewer elements. The large top panel and four C buttons are physical macro controls shown as static artwork.</desc>
  <defs>
    <path id="ShellOutline" d="M315 50 C274 48 216 55 182 69 C132 89 108 119 93 169 C76 230 56 343 42 426 C27 513 27 558 42 601 C53 630 81 653 117 654 C157 656 184 627 205 582 C224 540 231 493 259 458 C282 430 323 430 376 430 H624 C677 430 718 430 741 458 C769 493 776 540 795 582 C816 627 843 656 883 654 C919 653 947 630 958 601 C973 558 973 513 958 426 C944 343 924 230 907 169 C892 119 868 89 818 69 C784 55 726 48 685 50 L654 76 L568 132 Q550 144 529 143 H471 Q450 144 432 132 L346 76 Z"/>
